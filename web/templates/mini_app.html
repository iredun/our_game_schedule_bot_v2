<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Создать игру</title>
  <link rel="stylesheet" href="/static/css/mini_app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/static/js/mini_app.js" defer></script>
</head>
<body>
  <main class="page">
    <nav class="app-nav" aria-label="Навигация">
      <a href="/app" aria-current="page">Создать игру</a>
      <a href="/games">Список игр</a>
    </nav>
    <h1>Создать игру</h1>
    <form id="game-form">
      <label for="chat">Чат</label>
      <select id="chat" required><option value="">Загрузка чатов…</option></select>

      <label for="starts">Дата и время</label>
      <input id="starts" type="datetime-local" required>

      <label for="description">Название или описание</label>
      <textarea id="description" maxlength="1000">#игра</textarea>

      <div class="row">
        <div>
          <label for="duration">Длительность, мин</label>
          <input id="duration" type="number" min="30" max="720" value="120" required>
        </div>
        <div>
          <label for="price">Цена за час, ₽</label>
          <input id="price" type="number" min="0" value="2000" required>
        </div>
      </div>

      <label for="players">Максимум игроков</label>
      <input id="players" type="number" min="1" max="100" value="14" required>

      <button id="submit" type="submit">Опубликовать игру</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>
</body>
</html>
